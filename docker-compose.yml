version: '3.8'

services:
  # AgentChain Enterprise FastAPI Backend & Static SPA Gateway
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agentchain_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SECRET_KEY=agentchain-enterprise-super-secret-key-32bytes!
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  # PostgreSQL 16 Relational & Domain Model Store
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentchain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis 7 In-Memory Cache & Nonce Store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Qdrant Vector Search Engine
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
