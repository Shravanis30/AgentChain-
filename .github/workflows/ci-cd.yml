name: AgentChain Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v

  smart-contract-test:
    name: Smart Contract Hardhat Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Contract Dependencies
      run: |
        cd contracts
        npm ci || npm install

    - name: Compile and Test Solidity Contracts
      run: |
        cd contracts
        npx hardhat test

  frontend-test:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install

    - name: TypeScript Typecheck
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Build Next.js Production Bundle
      env:
        NEXT_TELEMETRY_DISABLED: '1'
        NEXT_PUBLIC_API_URL: 'http://localhost:8000'
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: '3a8170812b534d0ff9d794f19a901d64'
        NEXT_PUBLIC_SIWE_DOMAIN: 'localhost:3000'
        NEXT_PUBLIC_SIWE_URI: 'http://localhost:3000'
        NEXT_PUBLIC_MARKETPLACE_CONTRACT_ADDRESS: '0x33b0709B52e782aB9576B6044132E65A3AF5206E'
        NEXT_PUBLIC_REGISTRY_CONTRACT_ADDRESS: '0x8218bDB16D7E71d4F51D31D6F0e919C1302CD6d1'
        NEXT_PUBLIC_CHAIN_ID: '80002'
      run: |
        cd frontend
        npm run build

  build-docker:
    name: Build Production Docker Image
    needs: [backend-test, smart-contract-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: infra/docker/Dockerfile.backend
        push: false
        tags: agentchain/backend:latest,agentchain/backend:${{ github.sha }}
