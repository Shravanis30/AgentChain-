<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="40" y="40" width="2320" height="100" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <text x="80" y="95" font-size="32" font-weight="800" fill="#FFFFFF">2. C4 Container Diagram - AgentChain Architecture</text>
  <text x="80" y="125" font-size="16" fill="#94A3B8">High-level runnable containers, API boundaries, database clusters, messaging buses, and blockchain integrations</text>

  <!-- CONTAINERS LAYOUT GRID -->
  <!-- Container 1: Web SPA -->
  <rect x="80" y="200" width="480" height="220" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="245" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">🌐 Web Portal SPA</text>
  <text x="320" y="280" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">[Container: Next.js / React]</text>
  <text x="320" y="320" font-size="14" fill="#475569" text-anchor="middle">Provides interactive workspace, dashboard,</text>
  <text x="320" y="350" font-size="14" fill="#475569" text-anchor="middle">marketplace browsing &amp; SIWE auth.</text>

  <!-- Container 2: Mobile App -->
  <rect x="80" y="460" width="480" height="220" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="505" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">📱 Mobile Client</text>
  <text x="320" y="540" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">[Container: React Native / Flutter]</text>
  <text x="320" y="580" font-size="14" fill="#475569" text-anchor="middle">Native mobile interface with voice streaming</text>
  <text x="320" y="610" font-size="14" fill="#475569" text-anchor="middle">and real-time agent notifications.</text>

  <!-- Container 3: API Gateway -->
  <rect x="660" y="330" width="480" height="240" rx="16" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="375" font-size="22" font-weight="700" fill="#0369A1" text-anchor="middle">🚪 API Gateway</text>
  <text x="900" y="410" font-size="14" font-weight="600" fill="#0284C7" text-anchor="middle">[Container: Envoy Proxy / Go]</text>
  <text x="900" y="450" font-size="14" fill="#475569" text-anchor="middle">Handles TLS termination, JWT/SIWE authentication,</text>
  <text x="900" y="480" font-size="14" fill="#475569" text-anchor="middle">rate limiting, and gRPC routing.</text>

  <!-- Container 4: Orchestrator Engine -->
  <rect x="1240" y="200" width="520" height="300" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="1500" y="245" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">⚙️ Core Orchestrator Engine</text>
  <text x="1500" y="280" font-size="14" font-weight="600" fill="#7C3AED" text-anchor="middle">[Container: Go Microservice / Temporal]</text>
  <text x="1500" y="320" font-size="14" fill="#475569" text-anchor="middle">Parses user tasks, builds DAG plans,</text>
  <text x="1500" y="350" font-size="14" fill="#475569" text-anchor="middle">matches agent capabilities, and manages workflow</text>
  <text x="1500" y="380" font-size="14" fill="#475569" text-anchor="middle">state machines and execution safety.</text>

  <!-- Container 5: Multi-Agent Swarm Workers -->
  <rect x="1240" y="540" width="520" height="300" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1500" y="585" font-size="22" font-weight="700" fill="#3730A3" text-anchor="middle">🐝 Multi-Agent Swarm Workers</text>
  <text x="1500" y="620" font-size="14" font-weight="600" fill="#4F46E5" text-anchor="middle">[Container: Python WASM Containers]</text>
  <text x="1500" y="660" font-size="14" fill="#475569" text-anchor="middle">Containerized specialized agent execution pods</text>
  <text x="1500" y="690" font-size="14" fill="#475569" text-anchor="middle">(Research, Coding, Finance, Legal, DevOps)</text>
  <text x="1500" y="720" font-size="14" fill="#475569" text-anchor="middle">communicating via peer-to-peer event bus.</text>

  <!-- Container 6: Memory & Vector DB Cluster -->
  <rect x="1840" y="200" width="480" height="240" rx="16" fill="#FAF5FF" stroke="#9333EA" stroke-width="2" filter="url(#shadow)"/>
  <text x="2080" y="245" font-size="22" font-weight="700" fill="#6B21A8" text-anchor="middle">🗄️ Vector &amp; Knowledge Store</text>
  <text x="2080" y="280" font-size="14" font-weight="600" fill="#9333EA" text-anchor="middle">[Database Cluster: Qdrant / Redis]</text>
  <text x="2080" y="320" font-size="14" fill="#475569" text-anchor="middle">Stores embeddings, long-term memory,</text>
  <text x="2080" y="350" font-size="14" fill="#475569" text-anchor="middle">and enables hybrid BM25 + vector search.</text>

  <!-- Container 7: Dynamic LLM Router -->
  <rect x="1840" y="480" width="480" height="240" rx="16" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="2080" y="525" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">🤖 Dynamic LLM Router</text>
  <text x="2080" y="560" font-size="14" font-weight="600" fill="#0D9488" text-anchor="middle">[Container: Python / OpenRouter Mesh]</text>
  <text x="2080" y="600" font-size="14" fill="#475569" text-anchor="middle">Routes inference calls dynamically across</text>
  <text x="2080" y="630" font-size="14" fill="#475569" text-anchor="middle">GPT-4o, Claude 3.5, Gemini 1.5, DeepSeek.</text>

  <!-- Container 8: Event Streaming Bus -->
  <rect x="660" y="900" width="520" height="240" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="945" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">🟢 Apache Kafka Event Bus</text>
  <text x="920" y="980" font-size="14" font-weight="600" fill="#EA580C" text-anchor="middle">[Infrastructure Cluster: Kafka StatefulSet]</text>
  <text x="920" y="1020" font-size="14" fill="#475569" text-anchor="middle">Asynchronous inter-agent messaging bus,</text>
  <text x="920" y="1050" font-size="14" fill="#475569" text-anchor="middle">task queues, and telemetry streams.</text>

  <!-- Container 9: Blockchain Smart Contracts -->
  <rect x="1240" y="900" width="520" height="240" rx="16" fill="#FFF7ED" stroke="#C2410C" stroke-width="2" filter="url(#shadow)"/>
  <text x="1500" y="945" font-size="22" font-weight="700" fill="#9A3412" text-anchor="middle">📜 Web3 Smart Contracts</text>
  <text x="1500" y="980" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">[Blockchain: Polygon / Solidity]</text>
  <text x="1500" y="1020" font-size="14" fill="#475569" text-anchor="middle">Manages task escrow, DID identity,</text>
  <text x="1500" y="1050" font-size="14" fill="#475569" text-anchor="middle">on-chain reputation, and payment payouts.</text>

  <!-- CONNECTIONS -->
  <path d="M 560, 310 L 660, 410" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 560, 570 L 660, 480" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1140, 450 L 1240, 350" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1500, 500 L 1500, 540" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1760, 350 L 1840, 320" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1760, 690 L 1840, 600" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1240, 690 L 1180, 900" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1500, 840 L 1500, 900" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
