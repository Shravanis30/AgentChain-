<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="40" y="40" width="2320" height="100" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <text x="80" y="95" font-size="32" font-weight="800" fill="#FFFFFF">4. Deployment Diagram - Multi-Cloud Hybrid Infrastructure</text>
  <text x="80" y="125" font-size="16" fill="#94A3B8">Physical and virtual deployment nodes across AWS, Azure, and Web3 Polygon L2</text>

  <!-- CLOUDFLARE CDN / EDGE -->
  <rect x="80" y="180" width="2240" height="100" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1200" y="230" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">🌐 Global Cloudflare CDN &amp; Anycast Edge (DDoS Shield / SSL Termination)</text>

  <!-- AWS REGION CONTAINER -->
  <rect x="80" y="320" width="1080" height="1200" rx="20" fill="#F8FAFC" stroke="#FF9900" stroke-width="3" filter="url(#shadow)"/>
  <rect x="100" y="340" width="300" height="40" rx="8" fill="#FF9900"/>
  <text x="250" y="366" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">☁️ AWS REGION (us-east-1)</text>

  <g transform="translate(120, 410)">
    <!-- AWS EKS Cluster -->
    <rect x="0" y="0" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="500" y="45" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">☸️ Amazon EKS Cluster (Kubernetes 1.30)</text>

    <!-- Node Pool 1 -->
    <rect x="40" y="80" width="440" height="240" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="260" y="120" font-size="18" font-weight="700" fill="#0369A1" text-anchor="middle">Node Pool: API &amp; Orchestrator</text>
    <text x="260" y="150" font-size="14" fill="#475569" text-anchor="middle">Instance: c6i.2xlarge (Auto-scale)</text>
    <text x="260" y="180" font-size="13" fill="#64748B" text-anchor="middle">Pods: API Gateway, Task Analyzer,</text>
    <text x="260" y="210" font-size="13" fill="#64748B" text-anchor="middle">Task Planner, Result Aggregator</text>

    <!-- Node Pool 2 -->
    <rect x="520" y="80" width="440" height="240" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="740" y="120" font-size="18" font-weight="700" fill="#3730A3" text-anchor="middle">Node Pool: Swarm Agents</text>
    <text x="740" y="150" font-size="14" fill="#475569" text-anchor="middle">Instance: g5.4xlarge (NVIDIA A10G)</text>
    <text x="740" y="180" font-size="13" fill="#64748B" text-anchor="middle">Pods: Research, Coding, Vision,</text>
    <text x="740" y="210" font-size="13" fill="#64748B" text-anchor="middle">Voice &amp; WASM Sandbox Agents</text>

    <!-- StatefulSets -->
    <rect x="40" y="350" width="920" height="260" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="500" y="390" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">StatefulSets: Qdrant Vector &amp; Kafka Event Cluster</text>
    <text x="500" y="420" font-size="14" fill="#475569" text-anchor="middle">3x Qdrant Stateful Replicas (HNSW Vector Indexing)</text>
    <text x="500" y="450" font-size="14" fill="#475569" text-anchor="middle">3x Kafka Brokers + Zookeeper/KRaft Consensus</text>
    <text x="500" y="480" font-size="13" fill="#64748B" text-anchor="middle">Backed by AWS io2 EBS Provisioned IOPS Storage</text>
  </g>

  <!-- AWS Managed Services -->
  <g transform="translate(120, 1100)">
    <rect x="0" y="0" width="480" height="180" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="240" y="45" font-size="18" font-weight="700" fill="#C2410C" text-anchor="middle">🐘 AWS Aurora PostgreSQL</text>
    <text x="240" y="75" font-size="14" fill="#475569" text-anchor="middle">Multi-AZ Relational Storage</text>
    <text x="240" y="105" font-size="13" fill="#64748B" text-anchor="middle">Users, Market Listings, Audit Logs</text>

    <rect x="520" y="0" width="480" height="180" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="760" y="45" font-size="18" font-weight="700" fill="#C2410C" text-anchor="middle">🔴 AWS ElastiCache (Redis)</text>
    <text x="760" y="75" font-size="14" fill="#475569" text-anchor="middle">In-Memory Session &amp; Rate Limit</text>
    <text x="760" y="105" font-size="13" fill="#64748B" text-anchor="middle">Sub-millisecond Context Cache</text>
  </g>

  <!-- AZURE REGION CONTAINER -->
  <rect x="1240" y="320" width="1080" height="1200" rx="20" fill="#F8FAFC" stroke="#0078D4" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1260" y="340" width="300" height="40" rx="8" fill="#0078D4"/>
  <text x="1410" y="366" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">☁️ AZURE REGION (eastus)</text>

  <g transform="translate(1280, 410)">
    <!-- Azure AKS Cluster -->
    <rect x="0" y="0" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="500" y="45" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">☸️ Azure Kubernetes Service (AKS)</text>

    <!-- Node Pool 1 -->
    <rect x="40" y="80" width="440" height="240" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="260" y="120" font-size="18" font-weight="700" fill="#0369A1" text-anchor="middle">Failover Replica Nodes</text>
    <text x="260" y="150" font-size="14" fill="#475569" text-anchor="middle">Standard_D8s_v5 Pool</text>
    <text x="260" y="180" font-size="13" fill="#64748B" text-anchor="middle">Standby Orchestrators &amp;</text>
    <text x="260" y="210" font-size="13" fill="#64748B" text-anchor="middle">API Gateway Failover Ingress</text>

    <!-- Node Pool 2 -->
    <rect x="520" y="80" width="440" height="240" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <text x="740" y="120" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle">Azure OpenAI Dedicated Pods</text>
    <text x="740" y="150" font-size="14" fill="#475569" text-anchor="middle">Private VNet Peering</text>
    <text x="740" y="180" font-size="13" fill="#64748B" text-anchor="middle">Direct Managed Connections to</text>
    <text x="740" y="210" font-size="13" fill="#64748B" text-anchor="middle">GPT-4o &amp; Embeddings Models</text>

    <!-- Azure Managed Storage & Web3 Nodes -->
    <rect x="40" y="350" width="920" height="260" rx="12" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="500" y="390" font-size="18" font-weight="700" fill="#5B21B6" text-anchor="middle">Web3 Polygon RPC &amp; Blob Storage</text>
    <text x="500" y="420" font-size="14" fill="#475569" text-anchor="middle">Polygon zkEVM Full Execution Node</text>
    <text x="500" y="450" font-size="14" fill="#475569" text-anchor="middle">Azure Blob Storage (Encrypted Artifact Archives)</text>
    <text x="500" y="480" font-size="13" fill="#64748B" text-anchor="middle">IPFS Local Gateway Cluster</text>
  </g>
</svg>
