<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" style="background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="40" y="40" width="2320" height="100" rx="12" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <text x="80" y="95" font-size="32" font-weight="800" fill="#FFFFFF">6. Data Flow Diagram (DFD Level 1/2) - AgentChain Data Pipeline</text>
  <text x="80" y="125" font-size="16" fill="#94A3B8">Flow of prompts, embeddings, DAG graphs, vector context, execution proofs, and escrow tokens across platform data stores</text>

  <!-- EXTERNAL ENTITIES (RECTANGLES WITH DOUBLE BORDER) -->
  <rect x="80" y="240" width="360" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="320" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">E1: User Client</text>
  <text x="260" y="355" font-size="14" fill="#475569" text-anchor="middle">[External Entity]</text>

  <rect x="80" y="700" width="360" height="180" rx="12" fill="#F3E8FF" stroke="#A855F7" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="780" font-size="22" font-weight="700" fill="#6B21A8" text-anchor="middle">E2: External LLMs</text>
  <text x="260" y="815" font-size="14" fill="#475569" text-anchor="middle">[OpenAI/Claude/Gemini]</text>

  <rect x="80" y="1160" width="360" height="180" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="1240" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">E3: Polygon L2 Ledger</text>
  <text x="260" y="1275" font-size="14" fill="#475569" text-anchor="middle">[Blockchain Network]</text>

  <!-- PROCESSES (CIRCLES/ROUNDED CONTAINERS) -->
  <!-- Process 1 -->
  <rect x="620" y="240" width="480" height="180" rx="40" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#shadow)"/>
  <text x="860" y="315" font-size="22" font-weight="800" fill="#0369A1" text-anchor="middle">1.0 Ingestion &amp; Auth</text>
  <text x="860" y="350" font-size="14" fill="#475569" text-anchor="middle">Validates SIWE Signature &amp; Token Bucket Rate</text>

  <!-- Process 2 -->
  <rect x="620" y="700" width="480" height="180" rx="40" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3" filter="url(#shadow)"/>
  <text x="860" y="775" font-size="22" font-weight="800" fill="#5B21B6" text-anchor="middle">2.0 DAG Task Decomposition</text>
  <text x="860" y="810" font-size="14" fill="#475569" text-anchor="middle">Parses Intent &amp; Builds Topological DAG Graph</text>

  <!-- Process 3 -->
  <rect x="1300" y="240" width="480" height="180" rx="40" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" filter="url(#shadow)"/>
  <text x="1540" y="315" font-size="22" font-weight="800" fill="#3730A3" text-anchor="middle">3.0 Swarm Execution</text>
  <text x="1540" y="350" font-size="14" fill="#475569" text-anchor="middle">Coordinates A2A Messages &amp; Agent Handoffs</text>

  <!-- Process 4 -->
  <rect x="1300" y="700" width="480" height="180" rx="40" fill="#FFFFFF" stroke="#9333EA" stroke-width="3" filter="url(#shadow)"/>
  <text x="1540" y="775" font-size="22" font-weight="800" fill="#6B21A8" text-anchor="middle">4.0 Semantic RAG Query</text>
  <text x="1540" y="810" font-size="14" fill="#475569" text-anchor="middle">Retrieves Vector Context &amp; Knowledge Graph</text>

  <!-- Process 5 -->
  <rect x="1300" y="1160" width="480" height="180" rx="40" fill="#FFFFFF" stroke="#C2410C" stroke-width="3" filter="url(#shadow)"/>
  <text x="1540" y="1235" font-size="22" font-weight="800" fill="#9A3412" text-anchor="middle">5.0 Settlement &amp; Proof</text>
  <text x="1540" y="1270" font-size="14" fill="#475569" text-anchor="middle">Verifies Proof-of-Task &amp; Triggers Escrow Payout</text>

  <!-- DATA STORES (OPEN ENDED RECTANGLES / CYLINDER STYLE) -->
  <rect x="620" y="480" width="480" height="150" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="860" y="540" font-size="20" font-weight="700" fill="#1E293B" text-anchor="middle">D1: Session Vault &amp; Cache [Redis]</text>

  <rect x="1300" y="480" width="480" height="150" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="1540" y="540" font-size="20" font-weight="700" fill="#1E293B" text-anchor="middle">D2: Task DAG Graph Store [PostgreSQL]</text>

  <rect x="1940" y="700" width="420" height="180" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="2150" y="775" font-size="20" font-weight="700" fill="#1E293B" text-anchor="middle">D3: Vector DB [Qdrant]</text>
  <text x="2150" y="810" font-size="14" fill="#475569" text-anchor="middle">Embeddings &amp; Long-Term Memory</text>

  <!-- CONNECTIONS -->
  <path d="M 440, 330 L 620, 330" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 860, 420 L 860, 480" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 860, 630 L 860, 700" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1100, 790 L 1300, 790" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1540, 420 L 1540, 480" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1780, 790 L 1940, 790" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1540, 880 L 1540, 1160" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1300, 1250 L 440, 1250" stroke="#EA580C" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
